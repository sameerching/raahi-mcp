[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raahi-mcp"
version = "0.1.0"
description = "Raahi: a minimal read-only MCP station lookup server"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Raahi Contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]
server = [
  "mcp>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
